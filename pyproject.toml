[project]
name = "tekla-harness"
version = "0.1.0"
description = "Multi-agent harness: structural drawings to Tekla Structures models, with gates and verification."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "ezdxf>=1.4.5",
    "jsonschema>=4.26",
    "referencing>=0.37",
]

[project.scripts]
harness = "tekla_harness.cli:main"

[dependency-groups]
dev = [
    "pytest>=9.2",
    "ruff>=0.17.4",
    "pre-commit>=4.7",
    "pyright>=1.1.414",
]

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tekla_harness"]

[tool.hatch.build.targets.wheel.force-include]
"schemas" = "tekla_harness/schema_files"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests", ".claude/hooks"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PTH"]

[tool.pyright]
include = ["src", "tests", ".claude/hooks"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
